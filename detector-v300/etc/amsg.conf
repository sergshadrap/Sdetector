# amsg configuration

# installation directory (empty = automatic: where amsg itself is; a "bin" folder is skipped)
DETECTOR_DIR=./

# detector preset: indoor | outdoor (empty = the detector's plain defaults)
#   indoor : grey picture at night, person confidence 0.50, detection windows from 450 px (RANGE near)
#   outdoor: grey picture at night, person confidence 0.45, detection windows from 128 px (RANGE far; untested first guess)
SCENE=indoor

# how large a person is in the picture: near | mid | far = smallest detection window 450 | 256 | 128 px
# (empty = taken from SCENE). far finds small distant persons, near copes better with a person who fills the picture
RANGE=

# minimum confidence of a person, 0.05 .. 0.99 (empty = taken from SCENE)
# lower = more persons found but more false alarms, higher = the opposite
CONFIDENCE=

# extra options for sdetector, added last (a repeated option wins), for example --gray=off --min-h=300
# the detector is always started with --model=<dir>/model/yolo26n-fp16_256_192 --sad-thr=100 --status=60; empty = nothing extra
SDETECTOR_ARGS=

# AM Server device protocol Only related if you using AMSG service for running detector
HTTP_PORT=8898
UDP_PORT=8898
# seconds between two state messages to the AM Server
NOTIFY_INTERVAL=60
# device name in the AM Server (the AM Server can change it, then this file is rewritten)
custom_name=OpenIpcCamTest

# AM Server ArmHome flag (ALARM_FLAG_UDN=DEBUG: always armed)
AM_SERVER_IP=
AM_SERVER_PORT=4030
ALARM_FLAG_UDN=
# seconds between two checks of the ArmHome flag
ALARM_POLL_INTERVAL=5

# email

# minimum seconds between two e-mails (0 = no limit); pictures in between are not sent
EMAIL_MIN_INTERVAL=4
# 1 = send an e-mail with the picture on an intrusion while armed, 0 = off
SMTP_ENABLE=1
SMTP_SERVER=smtp.gmail.com
SMTP_PORT=587
# 1 = STARTTLS (port 465: implicit TLS), 0 = plain text (tests in a LAN only)
SMTP_TLS=1
SMTP_USER=
SMTP_PASS=
SMTP_FROM=
SMTP_TO=
SMTP_SUBJECT=OpenIPC Intrusion TEST